keycloak:
  image:
    repository: bitnamilegacy/keycloak
  production: true
  commonAnnotations: # the PDB has no annotation value of its own
    ignore-check.kube-linter.io/pdb-unhealthy-pod-eviction-policy: "upstream chart has no setting for it"
  proxy: edge
  proxyHeaders: xforwarded
  resourcesPreset: "2xlarge"
  extraEnvVars:
    - name: "QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY"
      value: "true"
  ingress:
    enabled: false
  postgresql:
    enabled: false
  externalDatabase:
    host: database-cluster-rw.database.svc.cluster.local
    database: keycloak
    existingSecret: database-keycloak-user
    existingSecretUserKey: LOGIN
    existingSecretPasswordKey: PASSWORD
  initContainers:
    - name: theme-provider
      image: git.cura.nz/antoncuranz/keycloak-theme@sha256:57bd3d3f0260eb8667bda2184f8e9a98469e8377af427864d4d3e8789fa63bd7
      command: [sh, -ec]
      args:
        - cp /theme/keycloak-theme.jar /providers/keycloak-theme.jar
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        # Bitnami's prepare-write-dirs init container populates this subPath.
        - name: empty-dir
          mountPath: /providers
          subPath: app-providers-dir
  auth:
    adminPassword: "unused"
