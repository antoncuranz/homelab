app-template:
  controllers:
    hermes:
      forceRename: hermes
      strategy: RollingUpdate
      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          fsGroup: 10000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        fix-run:
          image:
            repository: docker.io/library/busybox
            tag: "1.38"
          command:
            - sh
            - -c
            - chown 10000:10000 /run && chmod 755 /run
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
      containers:
        main:
          image:
            repository: docker.io/nousresearch/hermes-agent
            tag: v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          args:
            - sleep
            - infinity
          env:
            HERMES_HOME: /opt/data
            HOME: /opt/data
            HERMES_DASHBOARD: "true"
            HERMES_DASHBOARD_PUBLIC_URL: https://hermes.serverton.de
            HERMES_DASHBOARD_OIDC_ISSUER: https://keycloak.serverton.de/realms/serverton
            HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
            TZ: Europe/Berlin
          envFrom:
            - secretRef:
                name: hermes
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 768Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
    camofox:
      forceRename: camofox
      strategy: Recreate
      pod:
        automountServiceAccountToken: false
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/jo-inc/camofox-browser
            tag: 1.14.0@sha256:86c79eed8a6b3a78859f73bc70d6003c5566b85e969354ec454524b28197ffce
          env:
            CAMOFOX_BIND_HOST: 0.0.0.0
            CAMOFOX_PORT: "9377"
            CAMOFOX_CRASH_REPORT_ENABLED: "false"
            CAMOFOX_API_KEY: "anton"
          ports:
            - name: http
              containerPort: 9377
              protocol: TCP
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
                failureThreshold: 30
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 20
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
    signal-cli:
      forceRename: signal-cli
      strategy: Recreate
      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/asamk/signal-cli
            tag: 0.14.7@sha256:5b8059ae7fbf1dccb71833ea3a072c888d5513a60cf5bf95b1d6fc072f42610a
          args:
            - daemon
            - --http=0.0.0.0:8080
            - --no-receive-stdout
          env:
            TZ: Europe/Berlin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/check
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 20
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/check
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  persistence:
    hermes-data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        hermes:
          main:
            - path: /opt/data
        signal-cli:
          main:
            - path: /opt/data
              readOnly: true
    hermes-run:
      type: emptyDir
      advancedMounts:
        hermes:
          main:
            - path: /run
          fix-run:
            - path: /run
    hermes-tmp:
      type: emptyDir
      advancedMounts:
        hermes:
          main:
            - path: /tmp
    signal-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        signal-cli:
          main:
            - path: /var/lib/signal-cli
    signal-tmp:
      type: emptyDir
      advancedMounts:
        signal-cli:
          main:
            - path: /tmp
    camofox-cache:
      enabled: true
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        camofox:
          main:
            - path: /root/.cache/camoufox

  service:
    main:
      controller: hermes
      forceRename: hermes
      ports:
        http:
          port: 9119
          targetPort: dashboard
    camofox:
      controller: camofox
      forceRename: camofox
      ports:
        http:
          port: 9377
          targetPort: http
    signal-cli:
      controller: signal-cli
      forceRename: signal-cli
      ports:
        http:
          port: 8080
          targetPort: http

  route:
    main:
      hostnames:
        - hermes.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main
              port: http
