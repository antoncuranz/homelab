camofox:
  global:
    nameOverride: camofox
    fullnameOverride: camofox

  controllers:
    main:
      strategy: Recreate
      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault

      containers:
        main:
          image:
            repository: ghcr.io/redf0x1/camofox-browser
            tag: 2.4.6@sha256:41e79fb61d50f0a8292b2a51c81ebcb0a2be24d89e9eac970edd12613006ced7
          env:
            CAMOFOX_HOST: 0.0.0.0
            CAMOFOX_PORT: "9377"
            CAMOFOX_HEADLESS: "true"
            CAMOFOX_AUTH_MODE: disabled
          ports:
            - name: http
              containerPort: 9377
              protocol: TCP
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
                failureThreshold: 30
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 20
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
                failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  persistence:
    data:
      type: emptyDir
      globalMounts:
        - path: /home/node/.camofox
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
    shm:
      type: emptyDir
      medium: Memory
      sizeLimit: 512Mi
      globalMounts:
        - path: /dev/shm

  service:
    main:
      ports:
        http:
          port: 9377
          targetPort: http

signal-cli-rest-api:
  global:
    nameOverride: signal-cli-rest-api

  controllers:
    main:
      strategy: Recreate
      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault

      containers:
        main:
          image:
            repository: ghcr.io/asamk/signal-cli
            tag: 0.14.6@sha256:071beb95fa691859254e8066d82eb3f000ef2c8ebe4fbefaf39ce68a81686174
          args:
            - daemon
            - --http=0.0.0.0:8080
            - --no-receive-stdout
          env:
            TZ: Europe/Berlin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/check
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 20
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/check
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  persistence:
    config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /var/lib/signal-cli
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp

  service:
    main:
      forceRename: signal-cli
      ports:
        http:
          port: 8080
          targetPort: http

app-template:
  controllers:
    main:
      strategy: RollingUpdate

      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          fsGroup: 10000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault


      initContainers:
        fix-run:
          image:
            repository: docker.io/library/busybox
            tag: "1.38"
          command:
            - sh
            - -c
            - chown 10000:10000 /run && chmod 755 /run
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false

      containers:
        main:
          image:
            repository: docker.io/nousresearch/hermes-agent
            tag: v2026.7.20@sha256:f7b35053268f532f98955195c909f15a230470fbcbdacaa9fdecb95707dad04a
          args:
            - sleep
            - infinity
          env:
            HERMES_HOME: /opt/data
            HOME: /opt/data
            HERMES_DASHBOARD: "true"
            HERMES_DASHBOARD_PUBLIC_URL: https://hermes.serverton.de
            HERMES_DASHBOARD_OIDC_ISSUER: https://keycloak.serverton.de/realms/serverton
            HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
            TZ: Europe/Berlin
          envFrom:
            - secretRef:
                name: hermes
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 768Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 10Gi
      globalMounts:
        - path: /opt/data
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
    run:
      type: emptyDir
      globalMounts:
        - path: /run

  service:
    main:
      ports:
        http:
          port: 9119
          targetPort: dashboard

  route:
    main:
      hostnames:
        - hermes.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main
              port: http
