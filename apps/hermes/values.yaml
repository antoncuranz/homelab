signal-cli-rest-api:
  global:
    nameOverride: signal-cli-rest-api

  controllers:
    main:
      strategy: Recreate
      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault

      initContainers:
        fix-run:
          image:
            repository: docker.io/library/busybox
            tag: "1.38"
          command:
            - sh
            - -c
            - chown 1000:1000 /run && chmod 700 /run
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false

      containers:
        main:
          image:
            repository: docker.io/bbernhard/signal-cli-rest-api
            tag: 0.100-rootless@sha256:7f80cec95fc36408fae6bdc6b4534764d825d5bd02c5772db8740842bdd257f0
          env:
            MODE: json-rpc-native
            TZ: Europe/Berlin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v1/health
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 20
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /v1/health
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  persistence:
    config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /home/.local/share/signal-cli
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
    run:
      type: emptyDir
      globalMounts:
        - path: /run

  service:
    main:
      ports:
        http:
          port: 8080
          targetPort: http

  route:
    main:
      hostnames:
        - signal.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: Exact
                value: /api/v1/check
          filters:
            - type: ExtensionRef
              extensionRef:
                group: gateway.envoyproxy.io
                kind: HTTPRouteFilter
                name: signal-check
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main
              port: http

app-template:
  controllers:
    main:
      strategy: RollingUpdate

      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          fsGroup: 10000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault


      initContainers:
        fix-run:
          image:
            repository: docker.io/library/busybox
            tag: "1.38"
          command:
            - sh
            - -c
            - chown 10000:10000 /run && chmod 755 /run
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false

      containers:
        main:
          image:
            repository: docker.io/nousresearch/hermes-agent
            tag: v2026.7.20@sha256:f7b35053268f532f98955195c909f15a230470fbcbdacaa9fdecb95707dad04a
          args:
            - sleep
            - infinity
          env:
            HERMES_HOME: /opt/data
            HOME: /opt/data
            HERMES_DASHBOARD: "true"
            HERMES_DASHBOARD_PUBLIC_URL: https://hermes.serverton.de
            HERMES_DASHBOARD_OIDC_ISSUER: https://keycloak.serverton.de/realms/serverton
            HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
            TZ: Europe/Berlin
          envFrom:
            - secretRef:
                name: hermes
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 768Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 10Gi
      globalMounts:
        - path: /opt/data
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp
    run:
      type: emptyDir
      globalMounts:
        - path: /run

  service:
    main:
      ports:
        http:
          port: 9119
          targetPort: dashboard

  route:
    main:
      hostnames:
        - hermes.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main
              port: http
