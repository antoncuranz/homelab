app-template:
  controllers:
    backend:
      strategy: RollingUpdate

      containers:
        main:
          image:
            repository: ghcr.io/antoncuranz/money-tracking/backend
            tag: latest@sha256:ec3e38116bbb6a5f822b28a7784a6714d6b660a2fb596692f91717902ec30b7a
            pullPolicy: Always
          env:
            ACTUAL_BASE_URL: "http://actual-rest.actual.svc.cluster.local:5007"
            ACTUAL_CAT_FX_FEES: "ff41dcbd-5962-4b32-b3fe-ce9d63cf9c25"
            ACTUAL_CAT_GROCERIES: "ff259c77-c898-447e-a156-9ee299e09a32"
            ACTUAL_CAT_DINING: "c1e2f6d7-dd3c-4f66-a1b4-eb6916aba30c"
            ACTUAL_UNKNOWN_PAYEE: "97f839af-dea1-4ec4-87c4-539112a3f478"
            PYDEVD_DISABLE_FILE_VALIDATION: "1"
            POSTGRES_HOST:
              valueFrom:
                secretKeyRef:
                  name: database-money-tracking-user
                  key: HOST
            POSTGRES_DATABASE:
              valueFrom:
                secretKeyRef:
                  name: database-money-tracking-user
                  key: DATABASE_NAME
            POSTGRES_USER:
              valueFrom:
                secretKeyRef:
                  name: database-money-tracking-user
                  key: LOGIN
            POSTGRES_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: database-money-tracking-user
                  key: PASSWORD
          envFrom:
            - secretRef:
                name: money-tracking-secrets

      extraSelectorLabels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/controller: main
    frontend:
      strategy: RollingUpdate

      containers:
        main:
          image:
            repository: ghcr.io/antoncuranz/money-tracking/frontend
            tag: latest@sha256:e3cf8391ded7d2351dcee8ed0b5c9496ea6a454ad99808e04cd6e2562c1bcf83
            pullPolicy: Always

      extraSelectorLabels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/controller: main
  service:
    backend:
      ports:
        http:
          port: 80

      forceRename: money-tracking-backend
      controller: backend
    frontend:
      ports:
        http:
          port: 3000

      forceRename: money-tracking-frontend
      controller: frontend
  serviceMonitor:
    backend:
      enabled: true
      endpoints:
        - port: http
          interval: 15m

      forceRename: money-tracking-backend
      serviceName: money-tracking-backend
      jobLabel: money-tracking-backend
  route:
    frontend:
      hostnames:
        - dollar.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 5m
            backendRequest: 5m
          backendRefs:
            - identifier: frontend
              port: 3000
      forceRename: money-tracking-frontend
