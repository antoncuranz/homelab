app-template:
  controllers:
    main:
      pod:
        hostNetwork: true
        # Home Assistant needs the host network for HomeKit/mDNS discovery, but
        # still needs to resolve the in-cluster Wyoming services.
        dnsPolicy: ClusterFirstWithHostNet

      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.11.1
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8123
                initialDelaySeconds: 60

    whisper:
      replicas: 0
      strategy: Recreate

      containers:
        main:
          image:
            repository: rhasspy/wyoming-whisper
            tag: 3.8.1
          args:
            - --model=small-int8
            - --language=de
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          probes:
            liveness: &whisperProbes
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 10300
            readiness: *whisperProbes
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 10300
                periodSeconds: 5
                failureThreshold: 120

    piper:
      replicas: 0
      strategy: Recreate

      containers:
        main:
          image:
            repository: rhasspy/wyoming-piper
            tag: 2.5.3
          args:
            - --voice=de_DE-thorsten-medium
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          probes:
            liveness: &piperProbes
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 10200
            readiness: *piperProbes
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 10200
                periodSeconds: 5
                failureThreshold: 120

    music-assistant:
      replicas: 1
      strategy: Recreate
      pod:
        # Required for mDNS/uPnP discovery and streaming to LAN players.
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet

      containers:
        main:
          image:
            repository: ghcr.io/music-assistant/server
            tag: 2.10.12
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          probes:
            liveness: &musicAssistantProbes
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8095
            readiness: *musicAssistantProbes
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8095
                periodSeconds: 5
                failureThreshold: 120

  persistence:
    config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /config
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: homeassistant-dst
    whisper-data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        whisper:
          main:
            - path: /data
    piper-data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        piper:
          main:
            - path: /data
    music-assistant-data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        music-assistant:
          main:
            - path: /data

  service:
    main:
      controller: main
      ports:
        http:
          port: 8123
    whisper:
      controller: whisper
      ports:
        wyoming:
          port: 10300
          protocol: TCP
    piper:
      controller: piper
      ports:
        wyoming:
          port: 10200
          protocol: TCP
    music-assistant:
      controller: music-assistant
      ports:
        http:
          port: 8095
        stream:
          port: 8097

  route:
    main:
      hostnames:
        - homeassistant.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main
              port: 8123
    music-assistant:
      hostnames:
        - musicassistant.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: music-assistant
              port: 8095
