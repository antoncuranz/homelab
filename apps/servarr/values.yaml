app-template:
  controllers:
    jellyfin:
      strategy: Recreate

      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
          supplementalGroups:
            - 44  # video
            - 109  # render

      containers:
        main:
          image:
            repository: jellyfin/jellyfin
            tag: "12.4" # quoted: unquoted 12.10 would render as 12.1
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              gpu.intel.com/i915: "1"
            limits:
              gpu.intel.com/i915: "1"
          probes:
            liveness: &probes1
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8096
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes1
            startup:
              enabled: false

      extraSelectorLabels:
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/controller: main
    jellyseerr:
      strategy: RollingUpdate

      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch

      containers:
        main:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.5.2
          env:
            TZ: Europe/Berlin
          probes:
            liveness: &probes2
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 5055
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes2
            startup:
              enabled: false

      extraSelectorLabels:
        app.kubernetes.io/name: jellyseerr
        app.kubernetes.io/controller: main
    prowlarr:
      strategy: RollingUpdate

      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
        annotations:
          setGateway: "true"

      containers:
        main:
          image:
            repository: ghcr.io/home-operations/prowlarr
            tag: 3.1.0.5799
          env:
            TZ: Europe/Berlin
            PROWLARR__SERVER__PORT: &port1 9696
            PROWLARR__LOG__DBENABLED: false
            PROWLARR__AUTH__METHOD: External
            PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
            PROWLARR__POSTGRES__HOST:
              valueFrom:
                secretKeyRef:
                  name: database-prowlarr-user
                  key: HOST
            PROWLARR__POSTGRES__USER:
              valueFrom:
                secretKeyRef:
                  name: database-prowlarr-user
                  key: LOGIN
            PROWLARR__POSTGRES__PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: database-prowlarr-user
                  key: PASSWORD
            PROWLARR__POSTGRES__MAINDB:
              valueFrom:
                secretKeyRef:
                  name: database-prowlarr-user
                  key: DATABASE_NAME
          probes:
            liveness: &probes3
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: *port1
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
            readiness: *probes3
            startup:
              enabled: false

      extraSelectorLabels:
        app.kubernetes.io/name: prowlarr
        app.kubernetes.io/controller: main
    radarr:
      strategy: RollingUpdate

      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
        annotations:
          setGateway: "true"

      containers:
        main:
          image:
            repository: ghcr.io/home-operations/radarr
            tag: 7.1.0.10948
          env:
            TZ: Europe/Berlin
            RADARR__SERVER__PORT: &port2 7878
            RADARR__LOG__DBENABLED: false
            RADARR__AUTH__METHOD: External
            RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
            RADARR__POSTGRES__HOST:
              valueFrom:
                secretKeyRef:
                  name: database-radarr-user
                  key: HOST
            RADARR__POSTGRES__USER:
              valueFrom:
                secretKeyRef:
                  name: database-radarr-user
                  key: LOGIN
            RADARR__POSTGRES__PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: database-radarr-user
                  key: PASSWORD
            RADARR__POSTGRES__MAINDB:
              valueFrom:
                secretKeyRef:
                  name: database-radarr-user
                  key: DATABASE_NAME
          probes:
            liveness: &probes4
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: *port2
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
            readiness: *probes4
            startup:
              enabled: false

      extraSelectorLabels:
        app.kubernetes.io/name: radarr
        app.kubernetes.io/controller: main
    sonarr:
      strategy: RollingUpdate

      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
        annotations:
          setGateway: "true"

      containers:
        main:
          image:
            repository: ghcr.io/home-operations/sonarr
            tag: 5.0.0.3041
          env:
            SONARR__SERVER__PORT: &port3 8989
            SONARR__LOG__DBENABLED: false
            SONARR__AUTH__METHOD: External
            SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
            SONARR__POSTGRES__HOST:
              valueFrom:
                secretKeyRef:
                  name: database-sonarr-user
                  key: HOST
            SONARR__POSTGRES__USER:
              valueFrom:
                secretKeyRef:
                  name: database-sonarr-user
                  key: LOGIN
            SONARR__POSTGRES__PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: database-sonarr-user
                  key: PASSWORD
            SONARR__POSTGRES__MAINDB:
              valueFrom:
                secretKeyRef:
                  name: database-sonarr-user
                  key: DATABASE_NAME
          probes:
            liveness: &probes5
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: *port3
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 3
            readiness: *probes5
            startup:
              enabled: false

      extraSelectorLabels:
        app.kubernetes.io/name: sonarr
        app.kubernetes.io/controller: main
    transmission:
      replicas: 0
      strategy: RollingUpdate

      pod:
        hostname: transmission
        annotations:
          setGateway: "true"
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch

      initContainers:
        01-init-themes:
          image:
            repository: registry.gitlab.com/antoncuranz/transmission-themes
            tag: latest@sha256:f5e74d7fc5b1f3b2c644e4178341cbc938149e7a95e0454581310ec447b9e72d
          command:
            - sh
          args:
            - -c
            - |
              echo "Copying themes..."
              cp -R /opt/transmission-ui/* /themes

      containers:
        main:
          image:
            repository: ghcr.io/home-operations/transmission
            tag: 4.1.4
          env:
            TZ: Europe/Berlin
            TRANSMISSION__BLOCKLIST_URL: "https://github.com/Naunter/BT_BlockLists/raw/master/bt_blocklists.gz"
            TRANSMISSION__DOWNLOAD_DIR: "/downloads/mediarr"
            TRANSMISSION__INCOMPLETE_DIR_ENABLED: false
            TRANSMISSION__RPC_PORT: &port4 9091
            TRANSMISSION__PEER_PORT: 9453
            TRANSMISSION__MESSAGE_LEVEL: 3
            TRANSMISSION__SPEED_LIMIT_DOWN_ENABLED: true
            TRANSMISSION__SPEED_LIMIT_DOWN: 20000
            TRANSMISSION_WEB_HOME: "/opt/transmission-ui/transmissionic"

      extraSelectorLabels:
        app.kubernetes.io/name: transmission
        app.kubernetes.io/controller: main
    sabnzbd:
      strategy: RollingUpdate

      pod:
        annotations:
          setGateway: "true"
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch

      containers:
        main:
          image:
            repository: ghcr.io/home-operations/sabnzbd
            tag: 5.1.3
          env:
            TZ: Europe/Berlin
            SABNZBD__PORT: 80
            SABNZBD__HOST_WHITELIST_ENTRIES: >-
              sabnzbd,
              sabnzbd.default,
              sabnzbd.default.svc,
              sabnzbd.default.svc.cluster,
              sabnzbd.default.svc.cluster.local,
              sabnzbd.serverton.de
          probes:
            liveness: &probes6
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api?mode=version
                  port: 80
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes6
            startup:
              enabled: false

      extraSelectorLabels:
        app.kubernetes.io/name: sabnzbd
        app.kubernetes.io/controller: main
  persistence:
    jellyfin-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 50Gi
      advancedMounts:
        jellyfin:
          main:
            - path: /config
      forceRename: servarr-jellyfin
    jellyfin-cache:
      enabled: true
      type: emptyDir
      advancedMounts:
        jellyfin:
          main:
            - path: /cache
    jellyfin-mediarr:
      enabled: true
      existingClaim: mediarr
      advancedMounts:
        jellyfin:
          main:
            - path: /filme
              subPath: filme
            - path: /serien
              subPath: serien

    jellyseerr-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: jellyseerr-dst

      advancedMounts:
        jellyseerr:
          main:
            - path: /app/config
      forceRename: servarr-jellyseerr
    prowlarr-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: prowlarr-dst

      advancedMounts:
        prowlarr:
          main:
            - path: /config
      forceRename: servarr-prowlarr
    radarr-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: radarr-dst
      advancedMounts:
        radarr:
          main:
            - path: /config
      forceRename: servarr-radarr
    radarr-mediarr:
      enabled: true
      existingClaim: mediarr
      advancedMounts:
        radarr:
          main:
            - path: /mediarr
    radarr-tmpfs:
      enabled: true
      type: emptyDir
      advancedMounts:
        radarr:
          main:
            - path: /config/MediaCover

    sonarr-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: sonarr-dst
      advancedMounts:
        sonarr:
          main:
            - path: /config
      forceRename: servarr-sonarr
    sonarr-mediarr:
      enabled: true
      existingClaim: mediarr
      advancedMounts:
        sonarr:
          main:
            - path: /mediarr
    sonarr-tmpfs:
      enabled: true
      type: emptyDir
      advancedMounts:
        sonarr:
          main:
            - path: /config/MediaCover

    transmission-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: transmission-dst
      advancedMounts:
        transmission:
          main:
            - path: /config
          01-init-themes:
            - path: /config
      forceRename: servarr-transmission
    transmission-mediarr:
      enabled: true
      existingClaim: mediarr
      advancedMounts:
        transmission:
          main:
            - path: /downloads/mediarr
              subPath: transmission
    transmission-themes:
      enabled: true
      type: emptyDir
      advancedMounts:
        transmission:
          01-init-themes:
            - path: /themes
          main:
            - path: /opt/transmission-ui

    sabnzbd-config:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: sabnzbd-dst
      advancedMounts:
        sabnzbd:
          main:
            - path: /config
      forceRename: servarr-sabnzbd
    sabnzbd-tmp:
      type: emptyDir
      advancedMounts:
        sabnzbd:
          main:
            - path: /tmp
    sabnzbd-mediarr:
      enabled: true
      existingClaim: mediarr
      advancedMounts:
        sabnzbd:
          main:
            - path: /mediarr
              subPath: sabnzbd

  service:
    jellyfin:
      ports:
        http:
          port: 8096


      forceRename: servarr-jellyfin
      controller: jellyfin
    jellyseerr:
      ports:
        http:
          port: 5055

      forceRename: servarr-jellyseerr
      controller: jellyseerr
    prowlarr:
      ports:
        http:
          port: *port1
      forceRename: servarr-prowlarr
      controller: prowlarr
    radarr:
      ports:
        http:
          port: *port2
      forceRename: servarr-radarr
      controller: radarr
    sonarr:
      ports:
        http:
          port: *port3
      forceRename: servarr-sonarr
      controller: sonarr
    transmission:
      ports:
        http:
          port: *port4
      forceRename: servarr-transmission
      controller: transmission
    sabnzbd:
      ports:
        http:
          port: 80

      forceRename: servarr-sabnzbd
      controller: sabnzbd
  route:
    jellyfin:
      hostnames:
        - jellyfin.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: jellyfin
              port: 8096


######################
# Jellyseerr         #
######################

      forceRename: servarr-jellyfin
    jellyseerr:
      hostnames:
        - seerr.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: jellyseerr
              port: 5055


######################
# Prowlarr           #
######################

      forceRename: servarr-jellyseerr
    prowlarr:
      hostnames:
        - prowlarr.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 5m
            backendRequest: 5m
          backendRefs:
            - identifier: prowlarr
              port: *port1


######################
# Radarr             #
######################

      forceRename: servarr-prowlarr
    radarr:
      hostnames:
        - radarr.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 5m
            backendRequest: 5m
          backendRefs:
            - identifier: radarr
              port: *port2


######################
# Sonarr             #
######################

      forceRename: servarr-radarr
    sonarr:
      hostnames:
        - sonarr.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 5m
            backendRequest: 5m
          backendRefs:
            - identifier: sonarr
              port: *port3


######################
# Transmission       #
######################

      forceRename: servarr-sonarr
    transmission:
      hostnames:
        - transmission.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: transmission
              port: *port4


######################
# sabnzbd            #
######################

      forceRename: servarr-transmission
    sabnzbd:
      hostnames:
        - sabnzbd.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: sabnzbd
              port: 80
      forceRename: servarr-sabnzbd
