---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homebridge
  namespace: homebridge
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: homebridge
  path: ./apps/homebridge/app
  components:
    - ../../../components/volsync
  postBuild:
    substitute:
      APP: homebridge
      VOLSYNC_CAPACITY: 250Mi
