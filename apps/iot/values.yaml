app-template:
  controllers:
    mosquitto:
      containers:
        main:
          image:
            repository: docker.io/library/eclipse-mosquitto
            tag: 2.0.23
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 16Mi
      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          runAsNonRoot: true
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
      extraSelectorLabels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/controller: main
    node-red:
      pod:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: "OnRootMismatch"

      containers:
        main:
          image:
            repository: docker.io/nodered/node-red
            tag: 5.0.10
          resources:
            requests:
              cpu: 5m
              memory: 512Mi
            limits:
              memory: 512Mi
      extraSelectorLabels:
        app.kubernetes.io/name: node-red
        app.kubernetes.io/controller: main
  service:
    mosquitto:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/sharing-key: default
        lbipam.cilium.io/sharing-cross-namespace: "*"
        lbipam.cilium.io/ips: 192.168.1.11
      ports:
        mqtt:
          enabled: true
          port: 1883
      forceRename: iot-mosquitto
      controller: mosquitto
    node-red:
      ports:
        http:
          port: 1880
      forceRename: iot-node-red
      controller: node-red
  persistence:
    mosquitto-mosquitto-conf:
      type: configMap
      name: mosquitto-config
      advancedMounts:
        mosquitto:
          main:
            - path: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
    mosquitto-secret:
      type: secret
      name: mqtt-secret
      advancedMounts:
        mosquitto:
          main:
            - path: /mosquitto/mosquitto_pwd
              subPath: mosquitto_pwd
    mosquitto-tibber:
      enabled: true
      type: secret
      name: tibber-secret
      advancedMounts:
        mosquitto:
          main:
            - path: /mosquitto/tibber_certs
    mosquitto-data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: mosquitto-dst

      advancedMounts:
        mosquitto:
          main:
            - path: /mosquitto/data
      forceRename: iot-mosquitto
    node-red-data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Mi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: node-red-dst
      advancedMounts:
        node-red:
          main:
            - path: /data
      forceRename: iot-node-red
  route:
    node-red:
      hostnames:
        - mqtt.serverton.de
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: node-red
              port: 1880
      forceRename: iot-node-red
