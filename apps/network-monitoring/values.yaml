app-template:
  controllers:
    tc4400-exporter:
      annotations:
        ignore-check.kube-linter.io/host-network: "reaches the cable modem via the host network"
      pod:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet

      containers:
        main:
          image:
            repository: ghcr.io/antoncuranz/tc4400_exporter
            tag: latest@sha256:7c083677bc6d1a043ca322fafc5b32822323c64d01e46a5e48c95852e07d8120
            pullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: tc4400-exporter-secrets

      extraSelectorLabels:
        app.kubernetes.io/name: tc4400-exporter
        app.kubernetes.io/controller: main
    opnsense-exporter:
      containers:
        main:
          image:
            repository: ghcr.io/athennamind/opnsense-exporter
            tag: 0.0.20
            pullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: opnsense-exporter-secrets
          probes:
            liveness: &opnsenseExporterProbes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
            readiness: *opnsenseExporterProbes
      extraSelectorLabels:
        app.kubernetes.io/name: opnsense-exporter
        app.kubernetes.io/controller: main
  service:
    tc4400-exporter:
      ports:
        metrics:
          port: 9623

      forceRename: network-monitoring-tc4400-exporter
      controller: tc4400-exporter
    opnsense-exporter:
      type: ClusterIP
      ports:
        http:
          port: 8080

      forceRename: network-monitoring-opnsense-exporter
      controller: opnsense-exporter
  serviceMonitor:
    tc4400-exporter:
      enabled: true
      endpoints:
        - port: metrics
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s

      forceRename: network-monitoring-tc4400-exporter
      serviceName: network-monitoring-tc4400-exporter
      jobLabel: network-monitoring-tc4400-exporter
    opnsense-exporter:
      enabled: true
      endpoints:
        - port: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s
      forceRename: network-monitoring-opnsense-exporter
      serviceName: network-monitoring-opnsense-exporter
      jobLabel: network-monitoring-opnsense-exporter
