tc4400-exporter:
  global:
    nameOverride: tc4400-exporter

  controllers:
    main:
      annotations:
        ignore-check.kube-linter.io/host-network: "reaches the cable modem via the host network"
      pod:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet

      containers:
        main:
          image:
            repository: ghcr.io/antoncuranz/tc4400_exporter
            tag: latest@sha256:7c083677bc6d1a043ca322fafc5b32822323c64d01e46a5e48c95852e07d8120
            pullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: tc4400-exporter-secrets

  service:
    main:
      ports:
        metrics:
          port: 9623

  serviceMonitor:
    main:
      enabled: true
      endpoints:
        - port: metrics
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s

opnsense-exporter:
  global:
    nameOverride: opnsense-exporter

  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/athennamind/opnsense-exporter
            tag: 0.0.19
            pullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: opnsense-exporter-secrets
          probes:
            liveness: &opnsenseExporterProbes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 8080
            readiness: *opnsenseExporterProbes

  service:
    main:
      type: ClusterIP
      ports:
        http:
          port: 8080

  serviceMonitor:
    main:
      enabled: true
      endpoints:
        - port: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s
