app-template:
  controllers:
    main:
      forceRename: forgejo
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: codeberg.org/forgejo/forgejo
            tag: 17.0.2-rootless
          env:
            FORGEJO__server__DOMAIN: git.cura.nz
            FORGEJO__server__ROOT_URL: https://git.cura.nz/
            FORGEJO__server__DISABLE_SSH: "false"
            FORGEJO__server__START_SSH_SERVER: "true"
            FORGEJO__server__BUILTIN_SSH_SERVER_USER: git
            FORGEJO__server__SSH_DOMAIN: git.cura.nz
            FORGEJO__server__SSH_PORT: "22"
            FORGEJO__server__SSH_LISTEN_PORT: "2222"
            FORGEJO__service__DISABLE_REGISTRATION: "true"
            FORGEJO__security__INSTALL_LOCK: "true"
            FORGEJO__database__DB_TYPE: postgres
            FORGEJO__database__HOST:
              valueFrom:
                secretKeyRef:
                  name: database-forgejo-user
                  key: HOST
            FORGEJO__database__NAME:
              valueFrom:
                secretKeyRef:
                  name: database-forgejo-user
                  key: DATABASE_NAME
            FORGEJO__database__USER:
              valueFrom:
                secretKeyRef:
                  name: database-forgejo-user
                  key: LOGIN
            FORGEJO__database__PASSWD:
              valueFrom:
                secretKeyRef:
                  name: database-forgejo-user
                  key: PASSWORD
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/healthz
                  port: 3000
                initialDelaySeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/healthz
                  port: 3000
    runner:
      strategy: Recreate
      annotations:
        ignore-check.kube-linter.io/privileged-container: "Dedicated Docker daemon runs job containers"
        ignore-check.kube-linter.io/privilege-escalation-container: "Docker-in-Docker requires privileged mode"
        ignore-check.kube-linter.io/drop-net-raw-capability: "Docker-in-Docker manages container networking"
      pod:
        automountServiceAccountToken: false
      containers:
        main:
          image:
            repository: data.forgejo.org/forgejo/runner
            tag: 13.2.2
          command: ["forgejo-runner", "daemon", "--config", "/config/config.yaml"]
          env:
            DOCKER_HOST: tcp://127.0.0.1:2375
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        docker:
          image:
            repository: docker
            tag: 28.5.2-dind
          args: ["dockerd", "--host=tcp://127.0.0.1:2375", "--tls=false"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["docker", "-H", "tcp://127.0.0.1:2375", "info"]
                initialDelaySeconds: 5
                periodSeconds: 10
  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 20Gi
      dataSourceRef:
        kind: ReplicationDestination
        apiGroup: volsync.backube
        name: forgejo-dst
      advancedMounts:
        main:
          main:
            - path: /var/lib/gitea
    runner-config:
      type: secret
      name: forgejo-runner
      advancedMounts:
        runner:
          main:
            - path: /config
              readOnly: true
    runner-docker-data:
      type: emptyDir
      sizeLimit: 20Gi
      advancedMounts:
        runner:
          docker:
            - path: /var/lib/docker
  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
    ssh:
      controller: main
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/sharing-key: default
        lbipam.cilium.io/sharing-cross-namespace: "*"
        lbipam.cilium.io/ips: 192.168.1.11
      ports:
        ssh:
          port: 22
          targetPort: 2222
          protocol: TCP
  route:
    main:
      hostnames:
        - git.cura.nz
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - identifier: main
              port: 3000
