apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: forgejo-runner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          runner:
            capacity: 4
            labels:
              - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-26.04"
          cache:
            enabled: false
          container:
            privileged: false
            valid_volumes: []
            docker_host: "automount"
            force_pull: true
          server:
            connections:
              homelab:
                url: https://git.cura.nz/
                uuid: {{ `{{ .uuid | quote }}` }}
                token: {{ `{{ .token | quote }}` }}
  dataFrom:
    - extract:
        key: forgejo-runner
