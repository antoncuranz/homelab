apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  annotations:
    ignore-check.kube-linter.io/privileged-container: "Dedicated Docker daemon runs job containers"
    ignore-check.kube-linter.io/privilege-escalation-container: "Docker-in-Docker requires privileged mode"
    ignore-check.kube-linter.io/drop-net-raw-capability: "Docker-in-Docker manages container networking"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.1.0
          command: ["forgejo-runner", "daemon", "--config", "/config/config.yaml"]
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
        - name: docker
          image: docker:28.5.2-dind
          args: ["dockerd", "--host=tcp://127.0.0.1:2375", "--tls=false"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
          readinessProbe:
            exec:
              command: ["docker", "-H", "tcp://127.0.0.1:2375", "info"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        - name: config
          secret:
            secretName: forgejo-runner
        - name: docker-data
          emptyDir:
            sizeLimit: 20Gi
