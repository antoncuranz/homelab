name: Lint

# No `paths:` filter: lint is a required check, so it has to report on every PR.
# PRs only lint the charts they touch; manual runs lint everything.
on:
  pull_request:
  workflow_dispatch:

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v3.22.1"
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "v0.8.0"
  # renovate: datasource=github-releases depName=stackrox/kube-linter
  KUBE_LINTER_VERSION: "v0.8.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to diff against the PR base
          persist-credentials: false

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform and kube-linter
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          curl -sSfL -o "$HOME/.local/bin/kube-linter" \
            "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux"
          chmod +x "$HOME/.local/bin/kube-linter"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Render and lint changed charts
        if: forgejo.event_name == 'pull_request'
        run: ci/lint.sh --changed "origin/${{ forgejo.base_ref }}"

      - name: Render and lint all charts
        if: forgejo.event_name != 'pull_request'
        run: ci/lint.sh
