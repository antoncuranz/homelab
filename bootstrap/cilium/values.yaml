cilium:
  annotations:
    ignore-check.kube-linter.io/host-network: "CNI agent needs full host access"
    ignore-check.kube-linter.io/privileged-container: "CNI agent needs full host access"
    ignore-check.kube-linter.io/privilege-escalation-container: "CNI agent needs full host access"
    ignore-check.kube-linter.io/sensitive-host-mounts: "CNI agent needs full host access"
    ignore-check.kube-linter.io/drop-net-raw-capability: "CNI agent needs full host access"
  envoy:
    annotations:
      ignore-check.kube-linter.io/host-network: "node-local proxy for the CNI"
      ignore-check.kube-linter.io/privilege-escalation-container: "node-local proxy for the CNI"

  kubeProxyReplacement: true
  k8sServiceHost: 192.168.1.2
  k8sServicePort: 6443

  ipam:
    operator:
      clusterPoolIPv4PodCIDRList:
        - 10.42.0.0/16

  l2announcements:
    enabled: true

  k8sClientRateLimit:
    qps: 20
    burst: 40

  operator:
    annotations:
      ignore-check.kube-linter.io/host-network: "must run before pod networking is up"
    replicas: 1
    rollOutPods: true

  rollOutCiliumPods: true

  hubble:
    relay:
      enabled: true
    ui:
      enabled: true

  devices: "eno1 br-lan"
