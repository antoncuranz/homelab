argo-cd:
  global:
    domain: argocd.serverton.de
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: true # server-side diff for all apps
    cm:
      timeout.reconciliation: 86400s # 24h
      accounts.ai-agent: apiKey
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
    rbac:
      policy.csv: |
        p, ai-agent, applications, get, default/*, allow
  server:
    ingress:
      enabled: false
    httproute:
      enabled: true
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
      hostnames:
        - argocd.serverton.de
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: true
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
