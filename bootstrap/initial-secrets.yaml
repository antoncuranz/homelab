---
apiVersion: v1
kind: Namespace
metadata:
  name: secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-secret
  namespace: secrets
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
stringData:
  credentials: 'op://Kubernetes/Kubernetes Credentials File/content'
  token: 'op://Kubernetes/Kubernetes Access Token/Anmeldedaten'
---
apiVersion: v1
kind: Namespace
metadata:
  name: networking
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: networking
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
stringData:
  api-token: 'op://Kubernetes/Cloudflare Secrets/api-key'