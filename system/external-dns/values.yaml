external-dns:
  sources:
    - ingress
    - gateway-httproute
  provider: cloudflare
  policy: upsert-only # required since chart 1.24.0; previous default
  txtOwnerId: homelab
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: value
  extraArgs:
    - --annotation-filter=external-dns.alpha.kubernetes.io/exclude notin (true)

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
