# Limited access for investigating Argo CD drift in Cilium-generated certificates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-cilium-secret-read
  namespace: cilium
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cilium-ca, hubble-relay-client-certs, hubble-server-certs]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-cilium-secret-read
  namespace: cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-agent-cilium-secret-read
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: {{ .Release.Namespace }}
