apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: https-wildcard
      hostname: "*.serverton.de"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-serverton-de-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-root
      hostname: serverton.de
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: serverton-de-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-git-cura-nz
      hostname: git.cura.nz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: git-cura-nz-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: forgejo-ssh
      port: 22
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
